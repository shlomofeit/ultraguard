services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/
      MONGODB_NAME: ultraguard
    depends_on:
      - mongo

  mongo:
    image: mongo:9
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
